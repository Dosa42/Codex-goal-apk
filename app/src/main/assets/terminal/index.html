<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="xterm.css">
<style>html,body,#terminal-container{margin:0;width:100%;height:100%;background:#0d1117;overflow:hidden}</style>
</head><body><div id="terminal-container"></div>
<script>window.onerror=function(message){window.AndroidBridge?.onError(String(message));};</script>
<script src="xterm.js"></script><script>
/* Renderer cursor advances only after xterm consumes bytes. */
(() => {
  const term = new Terminal({cursorBlink:true, fontSize:13, cols:80, rows:24,
    fontFamily:"monospace", theme:{background:"#0d1117",foreground:"#c9d1d9"}});
  term.open(document.getElementById("terminal-container"));
  let context = null, next = 1, busy = false, revision = 0;
  const pending = new Map();
  term.onData(data => {
    const bytes = new TextEncoder().encode(data);
    let binary = "";
    for (const byte of bytes) binary += String.fromCharCode(byte);
    window.AndroidBridge?.onData(btoa(binary));
  });
  function drain() {
    if (busy || !pending.has(next)) return;
    busy = true;
    const seq = next, generation = revision, item = pending.get(seq);
    const bytes = Uint8Array.from(atob(item.chunkBase64), c => c.charCodeAt(0));
    term.write(bytes, () => {
      if (generation !== revision) return;
      pending.delete(seq);
      next = seq + 1;
      busy = false;
      drain();
    });
  }
  window.receiveChunks = (id, chunks) => {
    if (context !== id) {
      revision++; context = id; next = 1; busy = false; pending.clear(); term.reset();
    }
    for (const item of chunks) {
      if (item.seq >= next && !pending.has(item.seq)) pending.set(item.seq, item);
    }
    drain();
  };
  window.terminalDiagnostics = () => ({context,next,busy,pending:[...pending.keys()],
    text:Array.from({length:term.buffer.active.length},(_,i)=>term.buffer.active.getLine(i).translateToString(true)).join("\n")});
  window.AndroidBridge?.onReady();
})();

</script>
</body></html>
