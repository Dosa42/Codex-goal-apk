name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      ndk_version:
        description: 'Android NDK version to install (optional, e.g. 27.2.12479018)'
        required: false
        default: '27.2.12479018'
      cmake_version:
        description: 'Android CMake version to install (optional, e.g. 3.22.1)'
        required: false
        default: '3.22.1'
      expected_jni_libs:
        description: 'Comma-separated expected lib paths in APK (e.g. "lib/arm64-v8a/libnative.so"). Leave empty for Kotlin-only.'
        required: false
        default: ''

jobs:
  build:
    name: Build & Verify Debug APK
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: ${{ github.event.inputs.ndk_version || '27.2.12479018' }}
      CMAKE_VERSION: ${{ github.event.inputs.cmake_version || '3.22.1' }}
      EXPECTED_JNI_LIBS: ${{ github.event.inputs.expected_jni_libs || '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Log and Artifact Directories
        run: |
          mkdir -p build-logs
          mkdir -p ci-artifacts
          mkdir -p app/build/reports/tests

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Platform Tools
        run: |
          set -euo pipefail
          echo "Using Android SDK at: $ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          # Accept SDK licenses
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          
          # Install compile SDKs (including android-36 and android-36.1 matching compileSdk release(36) { minorApiLevel = 1 })
          echo "Installing SDK platform-tools, build-tools 36.0.0, platforms android-36 and android-36.1..."
          "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" > /dev/null

          # Install NDK & CMake if requested for future native compilation
          if [ -n "${NDK_VERSION:-}" ]; then
            echo "Installing NDK $NDK_VERSION..."
            "$SDKMANAGER" "ndk;$NDK_VERSION" > /dev/null
            echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          fi

          if [ -n "${CMAKE_VERSION:-}" ]; then
            echo "Installing CMake $CMAKE_VERSION..."
            "$SDKMANAGER" "cmake;$CMAKE_VERSION" > /dev/null
            CMAKE_DIR="$ANDROID_HOME/cmake/$CMAKE_VERSION/bin"
            if [ -d "$CMAKE_DIR" ]; then
              echo "$CMAKE_DIR" >> "$GITHUB_PATH"
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Prepare Keystore & Environment Secrets
        env:
          CI_DEBUG_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          
          # 1. Provide an empty .env file if absent so Secrets Gradle Plugin resolves defaultPropertiesFileName cleanly
          if [ ! -f ".env" ]; then
            echo "# Empty .env created for CI build" > .env
          fi

          # 2. Check for persistent repository secret keystore vs. ephemeral fallback
          SIGNING_INFO_FILE="ci-artifacts/SIGNING_IDENTITY.txt"
          echo "=== APK Signing Key Configuration ===" > "$SIGNING_INFO_FILE"

          if [ -n "${CI_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "Keystore Mode: PERSISTENT (Loaded from CI_DEBUG_KEYSTORE_BASE64 repository secret)" | tee -a "$SIGNING_INFO_FILE"
            echo "Update Continuity: SUPPORTED (APKs signed with this key can update previous installs)." | tee -a "$SIGNING_INFO_FILE"
            echo "$CI_DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ -f "debug.keystore" ]; then
            echo "Keystore Mode: EXISTING FILE (Found debug.keystore in workspace)" | tee -a "$SIGNING_INFO_FILE"
          else
            echo "Keystore Mode: EPHEMERAL (Auto-generated on runner)" | tee -a "$SIGNING_INFO_FILE"
            echo "WARNING: Update continuity NOT supported. Each ephemeral runner generates a new certificate." | tee -a "$SIGNING_INFO_FILE"
            echo "To enable update continuity on device without uninstalling, configure the CI_DEBUG_KEYSTORE_BASE64 repository secret." | tee -a "$SIGNING_INFO_FILE"
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "" >> "$SIGNING_INFO_FILE"
          echo "=== Certificate Fingerprints ===" >> "$SIGNING_INFO_FILE"
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey >> "$SIGNING_INFO_FILE"
          grep -E "Owner:|Issuer:|Certificate fingerprints:|SHA256:|SHA1:" "$SIGNING_INFO_FILE" || true

      - name: Run Unit Tests
        run: |
          set -o pipefail
          echo "Running unit tests with stdout/stderr captured..."
          gradle :app:testDebugUnitTest --no-daemon --continue 2>&1 | tee build-logs/test-debug.log

      - name: Assemble Debug APK
        run: |
          set -o pipefail
          echo "Building debug APK with stdout/stderr captured..."
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-logs/assemble-debug.log

      - name: Verify APK, JNI Manifest, and Checksums
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          # 1. Fail if APK is missing or empty
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found or 0 bytes at $APK_PATH" >&2
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "Verified APK size: $APK_SIZE bytes"

          cp "$APK_PATH" ci-artifacts/app-debug.apk
          (cd ci-artifacts && sha256sum app-debug.apk > SHA256SUMS.txt)
          cat ci-artifacts/SHA256SUMS.txt

          # 2. Detailed APK zip index audit
          echo "=== APK Contents Audit ==="
          unzip -l "$APK_PATH" > ci-artifacts/apk_contents.txt
          grep -E "classes.*\.dex|AndroidManifest\.xml|lib/" ci-artifacts/apk_contents.txt || true

          # 3. JNI Library Verification
          echo "=== JNI Verification ==="
          if [ -n "${EXPECTED_JNI_LIBS:-}" ]; then
            echo "Verifying required JNI shared libraries: $EXPECTED_JNI_LIBS"
            IFS=',' read -ra LIBS <<< "$EXPECTED_JNI_LIBS"
            MISSING_LIBS=0
            for lib in "${LIBS[@]}"; do
              trimmed_lib=$(echo "$lib" | xargs)
              if unzip -Z1 "$APK_PATH" | grep -Fx -- "$trimmed_lib" > /dev/null; then
                echo "  [FOUND] $trimmed_lib"
              else
                echo "  [MISSING] $trimmed_lib" >&2
                MISSING_LIBS=$((MISSING_LIBS + 1))
              fi
            done
            if [ "$MISSING_LIBS" -gt 0 ]; then
              echo "ERROR: $MISSING_LIBS required JNI libraries were missing from APK!" >&2
              exit 1
            fi
            echo "All expected JNI libraries verified in APK."
          else
            echo "JNI verification: NOT APPLICABLE (Current gate uses pure Kotlin WebSocket transport; no JNI libraries declared or expected)."
            if grep -q "lib/" ci-artifacts/apk_contents.txt; then
              echo "Note: Unspecified native libraries found in APK:"
              grep "lib/" ci-artifacts/apk_contents.txt
            fi
          fi

      - name: Upload Debug APK & Verification Manifests
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            ci-artifacts/app-debug.apk
            ci-artifacts/SHA256SUMS.txt
            ci-artifacts/SIGNING_IDENTITY.txt
            ci-artifacts/apk_contents.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs & Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-build-reports
          path: |
            build-logs/
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: warn
          retention-days: 7
